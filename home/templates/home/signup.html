{% extends 'base.html' %}
{% block content %}

<form method='POST' style='text-align: left; margin: 0 auto; width: 600px;'> {% csrf_token %}
    {{form.as_p}}
    <input class='btn btn-secondary' type='submit' name='Sign Up'/>
</form>

{% if form.errors %}
<div class="alert alert-danger my-5">
    {% for field, errors in form.errors.items %}
        {% for error in errors %}
            <p>{{ error }}</p>
        {% endfor %}
    {% endfor %}
</div>
{% endif %}

{% endblock %}
