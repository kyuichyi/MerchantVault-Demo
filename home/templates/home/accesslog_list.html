<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Access Logs</title>
    <style>
        /* Table styling */
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
        }
        th, td {
            padding: 12px;
            text-align: left;
            border-bottom: 1px solid #ddd;
        }
        th {
            background-color: #f2f2f2;
            font-weight: bold;
        }
        tr:hover {
            background-color: #f5f5f5;
        }
        /* Search bar styling */
        .search-container {
            margin-bottom: 20px;
            text-align: right;
        }
        .search-container input[type="text"] {
            padding: 8px;
            width: 300px;
            border: 1px solid #ccc;
            border-radius: 4px;
        }
    </style>
</head>
<body>
    <h2>Access Logs</h2>
    
    <!-- Search bar -->
    <div class="search-container">
        <form method="GET" action="{% url 'accesslog_list' %}">
            <input type="text" name="q" placeholder="Search logs..." value="{{ request.GET.q }}">
            <button type="submit">Search</button>
        </form>
    </div>

    <!-- Table layout for Access Logs -->
    <table>
        <thead>
            <tr>
                <th>User</th>
                <th>Action</th>
                <th>Timestamp</th>
                <th>Details</th>
            </tr>
        </thead>
        <tbody>
            {% for log in access_logs %}
            <tr>
                <td>{{ log.user }}</td>
                <td>{{ log.action }}</td>
                <td>{{ log.timestamp }}</td>
                <td>{{ log.details }}</td>
            </tr>
            {% empty %}
            <tr>
                <td colspan="4">No logs found.</td>
            </tr>
            {% endfor %}
        </tbody>
    </table>   
</body>
</html>
