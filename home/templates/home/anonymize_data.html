{% extends "base.html" %}

{% block content %}
    <h1>Anonymize Transactions Data</h1>
    
    <!-- K-value Selection Form -->
    <form method="post">
        {% csrf_token %}
        <label for="k_value">Select k-value:</label>
        <select name="k_value" id="k_value">
            {% for k in k_values %}
            <option value="{{ k }}" {% if k == k_value %}selected{% endif %}>{{ k }}</option>
            {% endfor %}
        </select>
        <button type="submit">Anonymize</button>
    </form>

    {% if show_results %}
        <!-- Display Anonymized Data -->
        <h2>Anonymized Transactions Data (k={{ k_value }})</h2>
        <div>
            {{ anonymized_data|safe }}  <!-- This render the HTML table generated by Pandas -->
        </div>

        <!-- Display Privacy vs Utility Graph -->
        <h2>Data Privacy vs. Utility Chart</h2>
        <img src="data:image/png;base64,{{ privacy_data }}" alt="Privacy vs Utility Chart" />

        <!-- Download Link for Anonymized Data -->
        <form action="{% url 'download_anonymized_data' %}" method="get">
            <input type="hidden" name="k" value="{{ k_value }}">
            <button type="submit" class="btn btn-primary">Download Anonymized Data</button>
        </form>
    {% endif %}
{% endblock %}
